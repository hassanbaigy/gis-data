<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hydrant Finder · Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    /* Hide the inner iOS frame's scroll-track */
    .dc-card *::-webkit-scrollbar { display: none; }
    .dc-card * { scrollbar-width: none; }

    /* Prompt-doc launch tile */
    .prompt-tile {
      width: 100%; height: 100%;
      background: #0a0a0a; color: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 36px 36px 32px; box-sizing: border-box;
      position: relative; overflow: hidden;
    }
    .prompt-tile::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(45deg, transparent 0 14px, rgba(252,211,77,0.06) 14px 28px);
      pointer-events: none;
    }
    .prompt-tile a {
      display: inline-flex; align-items: center; gap: 10px;
      background: #E11D29; color: #fff; padding: 18px 22px;
      font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 22px;
      letter-spacing: 0.04em; text-decoration: none; align-self: flex-start;
      box-shadow: 0 12px 32px rgba(225,29,41,0.45); position: relative;
    }
  </style>
</head>
<body>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/tokens.jsx"></script>
<script type="text/babel" src="components/map.jsx"></script>
<script type="text/babel" src="components/variations.jsx"></script>
<script type="text/babel" src="components/flow.jsx"></script>
<script type="text/babel" src="components/tablet.jsx"></script>

<div id="root"></div>

<script type="text/babel" data-screen-label="Hydrant Finder Canvas">
const { useEffect } = React;

// Helper: scale the iOS frame to fit a 380×820 artboard area without
// breaking the device's internal layout.
function PhoneBoard({ children, scale = 0.945 }) {
  return (
    <div style={{ width: 380, height: 820, position: 'relative', overflow: 'hidden', background: '#000' }}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: 'top left', width: 402, height: 874 }}>
        <IOSDevice dark>
          {children}
        </IOSDevice>
      </div>
    </div>
  );
}

function PromptTile() {
  return (
    <div className="prompt-tile">
      <div>
        <div style={{
          display: 'inline-block', padding: '4px 10px', background: '#FCD34D', color: '#0a0a0a',
          fontFamily: 'Inter, sans-serif', fontWeight: 800, fontSize: 11, letterSpacing: '0.18em',
        }}>CLAUDE CODE BRIEF</div>
        <div style={{
          fontFamily: '"Barlow Condensed", sans-serif', fontWeight: 800,
          fontSize: 58, lineHeight: 0.9, letterSpacing: '-0.02em', marginTop: 18,
        }}>
          SHIP THIS<br/>
          <span style={{ color: '#FCD34D' }}>IN ONE GO.</span>
        </div>
        <div style={{ color: 'rgba(255,255,255,0.6)', fontSize: 14, lineHeight: 1.5, maxWidth: 360, marginTop: 14 }}>
          A copy-paste-ready build prompt for Claude Code. Stack, file tree, Prisma schema, route handlers, all five screens spec'd against the mockups on the left.
        </div>
      </div>
      <a href="prompt.html" target="_blank" rel="noopener">
        OPEN BUILD PROMPT
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas minScale={0.15} maxScale={2.5}>
      <DCSection id="variations" title="Map screen — 3 variations" subtitle="Bottom sheet · Tactical HUD · Dispatch slip. All post-incident state with route + top 3 hydrants.">
        <DCArtboard id="varA" label="A · Bottom sheet"   width={380} height={820}>
          <PhoneBoard><VariationA/></PhoneBoard>
        </DCArtboard>
        <DCArtboard id="varB" label="B · Tactical HUD"   width={380} height={820}>
          <PhoneBoard><VariationB/></PhoneBoard>
        </DCArtboard>
        <DCArtboard id="varC" label="C · Dispatch slip"  width={380} height={820}>
          <PhoneBoard><VariationC/></PhoneBoard>
        </DCArtboard>
      </DCSection>

      <DCSection id="flow" title="End-to-end flow" subtitle="Login → Map home → New incident form → Result (variation A) → History">
        <DCArtboard id="login"    label="1 · Login"            width={380} height={820}>
          <PhoneBoard><ScreenLogin/></PhoneBoard>
        </DCArtboard>
        <DCArtboard id="home"     label="2 · Home / map"       width={380} height={820}>
          <PhoneBoard><ScreenHome/></PhoneBoard>
        </DCArtboard>
        <DCArtboard id="new"      label="3 · New incident"     width={380} height={820}>
          <PhoneBoard><ScreenNewIncident/></PhoneBoard>
        </DCArtboard>
        <DCArtboard id="result"   label="4 · Result (route)"   width={380} height={820}>
          <PhoneBoard><VariationA/></PhoneBoard>
        </DCArtboard>
        <DCArtboard id="history"  label="5 · History"          width={380} height={820}>
          <PhoneBoard><ScreenHistory/></PhoneBoard>
        </DCArtboard>
      </DCSection>

      <DCSection id="tablet" title="Truck-mount tablet (landscape)" subtitle="1180×820 — dispatch rail + map. Same data model, more glance area.">
        <DCArtboard id="tab1" label="Active incident · routed" width={1220} height={860}>
          <div style={{ width: 1220, height: 860, display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#1a1818' }}>
            <TabletFrame width={1180} height={820}>
              <ScreenTabletDispatch/>
            </TabletFrame>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="prompt" title="Build prompt" subtitle="Hand this to Claude Code with the mockups attached.">
        <DCArtboard id="prompt-tile" label="Open the build doc →" width={620} height={420}>
          <PromptTile/>
        </DCArtboard>
      </DCSection>

      <DCPostIt top={-46} left={70} rotate={-3} width={210}>
        Three takes on the same post-incident state. Lock one, then I'll thread it through the whole flow.
      </DCPostIt>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
